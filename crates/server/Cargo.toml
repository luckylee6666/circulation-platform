[package]
name = "circulation-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "流转平台服务端：HTTP API + 内嵌 Web 资源 + SQLite 存储"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
calamine = { version = "0.36.1", features = ["dates"] }
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
encoding_rs = "0.8.41"
mime_guess = "2.0.5"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["std"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors", "compression-gzip"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.26.1"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
